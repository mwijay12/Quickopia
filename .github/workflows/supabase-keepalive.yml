name: Supabase Free Tier Keep-Alive

on:
  schedule:
    # Run every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  ping:
    name: Heartbeat Ping
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Ping Supabase Heartbeat RPC with Retries
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::SUPABASE_URL or SUPABASE_ANON_KEY secret is not configured in repository secrets."
            exit 1
          fi

          # Strip trailing slash from URL if present
          URL="${SUPABASE_URL%/}/rest/v1/rpc/heartbeat_ping"
          MAX_RETRIES=4
          DELAY=5

          for attempt in $(seq 1 $MAX_RETRIES); do
            echo "Heartbeat ping attempt $attempt of $MAX_RETRIES to $URL..."
            
            HTTP_RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "$URL" \
              -H "apikey: $SUPABASE_ANON_KEY" \
              -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
              -H "Content-Type: application/json" \
              -d '{"p_pinger": "github-actions"}')

            HTTP_BODY=$(echo "$HTTP_RESPONSE" | sed '$d')
            HTTP_CODE=$(echo "$HTTP_RESPONSE" | tail -n1)

            if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
              echo "✅ Heartbeat acknowledged with HTTP $HTTP_CODE"
              echo "Response: $HTTP_BODY"
              exit 0
            else
              echo "⚠️ Attempt $attempt failed with HTTP $HTTP_CODE: $HTTP_BODY"
              if [ "$attempt" -lt "$MAX_RETRIES" ]; then
                echo "Waiting $DELAY seconds before retrying..."
                sleep $DELAY
                DELAY=$((DELAY * 2))
              fi
            fi
          done

          echo "::error::All $MAX_RETRIES heartbeat attempts failed. Supabase backend may be unresponsive or paused."
          exit 1
