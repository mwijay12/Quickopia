name: Release APK

# Builds a working APK with real keys from GitHub Secrets.
# Runs manually (Actions -> Release APK -> Run workflow) or on version tags (v*).
# Download link appears under GitHub -> Releases once finished.

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: 'stable'
          cache: true

      # Secrets -> .env: this is HOW public config enters the cloud-built APK.
      # SUPABASE_URL + publishable/anon key, Cloudinary name, Sentry DSN are
      # PUBLIC by design (sent with every request). AI provider keys
      # (GROQ/GEMINI/OPENROUTER/ELEVENLABS) live ONLY in Supabase Secrets
      # server-side — the Edge-only mobile client never reads them, so they
      # MUST NOT be written here (APK is a ZIP; bundled .env is readable).
      # NEVER add SERVICE_ROLE / sb_secret_* or DB passwords here.
      - name: Write .env from Secrets
        run: |
          cat << 'EOF' > .env
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          CLOUDINARY_CLOUD_NAME=${{ secrets.CLOUDINARY_CLOUD_NAME }}
          SENTRY_DSN=${{ secrets.SENTRY_DSN_MOBILE }}
          EOF

      - name: Guard .env (reject server keys)
        run: |
          if grep -qiE 'sb_secret_|service_role|GROQ_KEYS|GEMINI_KEYS|OPENROUTER_KEYS|ELEVENLABS_KEYS' .env; then
            echo "::error::Blocked: .env for the APK must not contain server/AI keys."
            exit 1
          fi
          echo "✅ .env guard passed (public values only)."

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: mobile/build/app/outputs/flutter-apk/app-release.apk

      - name: Attach APK to Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: mobile/build/app/outputs/flutter-apk/app-release.apk
