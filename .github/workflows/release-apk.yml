name: Release APK

# Builds a working APK with real keys from GitHub Secrets.
# Runs manually (Actions -> Release APK -> Run workflow) or on version tags (v*).
# Download link appears under GitHub -> Releases once finished.

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: 'stable'
          cache: true

      # Secrets -> .env: this is HOW keys enter the cloud-built APK.
      # SUPABASE_URL + SUPABASE_ANON_KEY are REQUIRED (already in your Secrets).
      # AI pools are OPTIONAL: only needed for the in-app fallback path.
      # Edge-function AI (primary path) uses Supabase secrets server-side instead.
      # NEVER add SERVICE_ROLE / sb_secret_* or DB passwords here.
      - name: Write .env from Secrets
        run: |
          cat << 'EOF' > .env
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          CLOUDINARY_CLOUD_NAME=${{ secrets.CLOUDINARY_CLOUD_NAME }}
          SENTRY_DSN=${{ secrets.SENTRY_DSN_MOBILE }}
          GROQ_KEYS=${{ secrets.GROQ_KEYS }}
          GEMINI_KEYS=${{ secrets.GEMINI_KEYS }}
          OPENROUTER_KEYS=${{ secrets.OPENROUTER_KEYS }}
          ELEVENLABS_KEYS=${{ secrets.ELEVENLABS_KEYS }}
          EOF

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: mobile/build/app/outputs/flutter-apk/app-release.apk

      - name: Attach APK to Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: mobile/build/app/outputs/flutter-apk/app-release.apk
